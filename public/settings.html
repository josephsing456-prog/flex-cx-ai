<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex CX - Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../css/settings.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="settings-container space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold">Flex CX Settings</h1>
      <a href="../index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">← Back to Workspace</a>
    </div>

    <div class="settings-section space-y-4">
      <h2 class="text-sm font-bold text-indigo-300 uppercase">AI Model Defaults</h2>
      <div>
        <label class="text-xs text-slate-400">Default Model</label>
        <select class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm mt-1">
          <option value="gemini-2.5-flash">Flex Flash 2.5 (Fastest)</option>
          <option value="gemini-2.0-flash">Flex Ultra 2.0 (High Precision)</option>
        </select>
      </div>
    </div>
  </div>
</body>
</html>
