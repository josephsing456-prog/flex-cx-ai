<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex CX - Document Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold">📄 Document Reader & Processor</h1>
      <a href="../index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">← Back to Chat</a>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
      <p class="text-slate-400">Upload documents to extract key information, summarize content, or answer specific questions.</p>
      <input type="file" class="block w-full text-sm text-slate-400
        file:mr-4 file:py-2 file:px-4
        file:rounded-full file:border-0
        file:text-sm file:font-semibold
        file:bg-indigo-500 file:text-white
        hover:file:bg-indigo-600 cursor-pointer" accept=".pdf,.txt,.docx">
      <button class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-lg">Process Document</button>
      <div class="mt-4 p-4 bg-slate-800 rounded-lg border border-slate-700">
        <h3 class="text-lg font-semibold text-indigo-300">Document Summary (Placeholder)</h3>
        <p class="text-sm text-slate-500 mt-2">Summarized content and extracted entities will appear here.</p>
      </div>
    </div>
  </div>
</body>
</html>
