<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex CX - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="auth-card space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-500 p-0.5 mx-auto flex items-center justify-center text-white font-extrabold text-2xl">F</div>
      <h1 class="text-2xl font-bold">Create Flex CX Account</h1>
      <p class="text-xs text-slate-400">Get started with your multi-modal Gemini AI CX suite</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-300">Full Name</label>
        <input type="text" required placeholder="John Doe" class="auth-input">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300">Email Address</label>
        <input type="email" required placeholder="user@flexcx.ai" class="auth-input">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300">Password</label>
        <input type="password" required placeholder="••••••••" class="auth-input">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 rounded-xl shadow-lg transition">Create Account</button>
    </form>

    <div class="text-center text-xs text-slate-400">
      Already have an account? <a href="login.html" class="text-indigo-400 hover:underline">Sign In</a>
    </div>
  </div>
</body>
</html>
