<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex CX - Knowledge Base & Guides</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold">📚 Smart Guides & Knowledge Base</h1>
      <a href="../index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">← Back to Chat</a>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
      <p class="text-slate-400">Explore interactive guides and search the comprehensive knowledge base for quick answers and best practices.</p>
      <input type="text" placeholder="Search the knowledge base or ask for a guide..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none">
      <button class="bg-purple-600 hover:bg-purple-500 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-lg">Get Guide / Search</button>
      <div class="mt-4 p-4 bg-slate-800 rounded-lg border border-slate-700">
        <h3 class="text-lg font-semibold text-indigo-300">Relevant Guides (Placeholder)</h3>
        <ul class="list-disc list-inside text-sm text-slate-500 mt-2 space-y-1">
          <li>Onboarding New CX Agents</li>
          <li>Handling Escalated Customer Issues</li>
          <li>Product Feature X Troubleshooting</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
